name: sanbookpay-master
services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - master-mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]}).ok }; if (!db.hello().isWritablePrimary) quit(1)'"]
      interval: 4s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - master-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 4s
      timeout: 3s
      retries: 15
  api:
    build:
      context: .
      dockerfile: integrations/master-payment/Dockerfile.api
    env_file: .env.master
    environment:
      MONGO_URI: mongodb://mongo:27017/sanbookpay_master?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      PORT: 3000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
    ports: ["127.0.0.1:3100:3000"]
  portal:
    build:
      context: .
      dockerfile: integrations/master-payment/Dockerfile.portal
    environment:
      API_INTERNAL_URL: http://api:3000
      PORTAL_ORIGIN: http://localhost:3200
      SESSION_COOKIE_SECURE: "false"
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.29.95.10
    ports: ["127.0.0.1:3200:3100"]
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.95.0/24
volumes:
  master-mongo:
  master-redis:
