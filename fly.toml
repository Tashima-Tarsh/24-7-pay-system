# fly.toml app configuration file generated for dynamo-pay-api on 2026-11-09T03:25:58+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dynamo-pay-api'
primary_region = 'iad'

[experimental]
  auto_rollback = true

[build]
  dockerfile = 'Dockerfile.payment-api'

[env]
  key = 'BASE_CHECKOUT_URL'
  value = 'https://dynamo-pay-portal.fly.dev'

[[mounts]]
  source = 'dynamo-pay-api-data'
  destination = '/app/data'

[[services]]
  protocol = ''
  internal_port = 6100
  ports = []

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[statics]]
  guest_path = '/app/public'
  url_prefix = ''
