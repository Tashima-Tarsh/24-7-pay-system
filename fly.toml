app = "dynamo-pay-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.payment-api"

[[env]]
  key = "NODE_ENV"
  value = "production"

[[env]]
  key = "PORT"
  value = "6100"

[[env]]
  key = "YOUPI_MODE"
  value = "localhost"

[[env]]
  key = "DATABASE_URL"
  value = ""

[[env]]
  key = "SQLITE_DB_PATH"
  value = "/app/data/youpi_pg.sqlite"

[[env]]
  key = "ENCRYPTION_MASTER_KEY"
  value = ""

[[env]]
  key = "JWT_SECRET"
  value = ""

[[env]]
  key = "INITIAL_ADMIN_EMAIL"
  value = ""

[[env]]
  key = "INITIAL_ADMIN_PASSWORD"
  value = ""

[[env]]
  key = "BASE_CHECKOUT_URL"
  value = "https://dynamo-pay-portal.fly.dev"

[experimental]
  auto_rollback = true

[[services]]
  internal_port = 6100
  external_port = 6100
  http_checks = []
  tcp_checks = []
  grace_period = "10s"
  restart_limit = 10
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

[mounts]
  source = "dynamo-pay-api-data"
  destination = "/app/data"

[[statics]]
  guest_path = "/app/public"
  url_path = "/"
