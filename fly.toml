# fly.toml app configuration file generated for 24-7-pay-system on 2026-11-08T21:41:50Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = '24-7-pay-system'
primary_region = 'iad'

[experimental]
  auto_rollback = true

[build]
  dockerfile = 'Dockerfile.payment-api'

[env]
  key = 'BASE_CHECKOUT_URL'
  value = 'https://dynamo-pay-portal.fly.dev'

[[mounts]]
  source = 'dynamo-pay-api-data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[services]]
  protocol = ''
  internal_port = 6100
  ports = []

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[statics]]
  guest_path = '/app/public'
  url_prefix = ''
