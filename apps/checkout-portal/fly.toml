app = "dynamo-pay-portal"
primary_region = "iad"

[build]
  dockerfile = "apps/checkout-portal/Dockerfile"
  context = ".."

[env]
  NODE_ENV = "production"
  PORT = "7000"
  BASE_PAYMENT_API_URL = "https://dynamo-pay-api.fly.dev"
  BASE_CHECKOUT_URL = "https://dynamo-pay-portal.fly.dev"

[experimental]
  auto_rollback = true

[[services]]
  internal_port = 7000
  external_port = 7000
  http_checks = []
  tcp_checks = []
  grace_period = "10s"
  restart_limit = 10
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
