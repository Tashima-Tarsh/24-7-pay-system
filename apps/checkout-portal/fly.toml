app = "dynamo-pay-portal"
primary_region = "iad"

[build]
  dockerfile = "apps/checkout-portal/Dockerfile"
  context = ".."

[[env]]
  key = "NODE_ENV"
  value = "production"

[[env]]
  key = "PORT"
  value = "7000"

[[env]]
  key = "BASE_PAYMENT_API_URL"
  value = "https://dynamo-pay-api.fly.dev"

[[env]]
  key = "BASE_CHECKOUT_URL"
  value = "https://dynamo-pay-portal.fly.dev"

[experimental]
  auto_rollback = true

[[services]]
  internal_port = 7000
  external_port = 7000
  http_checks = []
  tcp_checks = []
  grace_period = "10s"
  restart_limit = 10
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
