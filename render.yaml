services:
  - type: web
    name: dynamo-pay-live
    runtime: node
    repo: https://github.com/Tashima-Tarsh/24-7-pay-system
    branch: main
    plan: free
    region: singapore
    buildCommand: cd apps/checkout-portal && npm ci && npm run build && cd ../../ && npm ci --include=dev
    startCommand: node scripts/start-hosted.mjs
    healthCheckPath: /_ready
    autoDeploy: true
    envVars:
      - key: GIT_LFS_SKIP_SMUDGE
        value: "1"
      - key: NODE_VERSION
        value: 22.23.4
      - key: NODE_ENV
        value: production
      - key: SQLITE_DB_PATH
        value: /opt/render/project/src/data/youpi_pg.sqlite
      - key: DATABASE_URL
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: ENCRYPTION_MASTER_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GMAIL_OAUTH_CLIENT_ID
        sync: false
      - key: GMAIL_OAUTH_CLIENT_SECRET
        sync: false
      - key: GMAIL_REDIRECT_URI
        sync: false
