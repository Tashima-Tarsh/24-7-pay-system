name: Android UPI intent transport smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/common/src/upi*.js'
      - 'packages/core/src/upi-intent-builder.js'
      - 'public/assets/247-checkout.js'
      - 'scripts/android-upi-emulator-smoke.sh'
      - '.github/workflows/android-upi-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-upi-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci --install-links
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android URI handoff
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android-upi-emulator-smoke.sh
