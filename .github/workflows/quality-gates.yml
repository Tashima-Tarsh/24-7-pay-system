name: 24-7 Pay quality gates

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'public/**'
      - 'scripts/**'
      - 'server.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/quality-gates.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Runtime, type and regression verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --install-links
      - name: Check active merchant workspace syntax
        run: node --check public/assets/247-portal.js
      - name: Premium workspace integration contract checks
        run: node --test scripts/premium-workspace-contract.test.js
      - name: Validate runtime JavaScript
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Run full regression suite
        run: npm test
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-evidence
          path: output/testing/regression-results.json
          if-no-files-found: warn
