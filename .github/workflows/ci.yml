name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --install-links

      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high

      - name: Run Semgrep SAST
        run: |
          docker run --rm -v "${PWD}:/src" -w /src semgrep/semgrep:latest \
            semgrep scan --config=auto --metrics=off --json \
            --output=semgrep-results.json \
            --exclude=node_modules --exclude=output --exclude=docs \
            --exclude=audit-reports --exclude=assets
          node scripts/check-semgrep-report.mjs

      - name: Upload Semgrep findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-findings
          path: semgrep-results.json
          if-no-files-found: warn

      - name: Type check
        run: npm run typecheck

      - name: Scan tracked files for credentials
        run: node scripts/scan-secrets.js

      - name: Validate JavaScript runtime
        run: npm run build

      - name: Run test suite
        id: tests
        run: npm test
        env:
          NODE_ENV: test
          YOUPI_MODE: localhost
          SQLITE_DB_PATH: /tmp/ci_test.sqlite

      - name: Upload test results
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: output/testing/regression-results.json
