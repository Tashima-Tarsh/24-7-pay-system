name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --install-links

      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high

      - name: Run Semgrep SAST
        run: |
          docker run --rm -v "${PWD}:/src" -w /src semgrep/semgrep@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0 \
            semgrep scan --config=p/ci --metrics=off --json \
            --output=semgrep-results.json \
            --exclude=node_modules --exclude=output --exclude=docs \
            --exclude=audit-reports --exclude=assets
          node scripts/check-semgrep-report.mjs

      - name: Upload Semgrep findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semgrep-findings
          path: semgrep-results.json
          if-no-files-found: warn

      - name: Type check
        run: npm run typecheck

      - name: Scan tracked files for credentials
        run: node scripts/scan-secrets.js

      - name: Validate JavaScript runtime
        run: npm run build

      - name: Run test suite
        id: tests
        run: npm test
        env:
          NODE_ENV: test
          YOUPI_MODE: localhost
          SQLITE_DB_PATH: /tmp/ci_test.sqlite

      - name: Upload test results
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-results
          path: output/testing/regression-results.json

  postgres-acceptance:
    name: PostgreSQL financial integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci_pay_user
          POSTGRES_DB: ci_pay
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_pay_user -d ci_pay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --install-links
      - name: Exercise payment transactions on real PostgreSQL
        env:
          NODE_ENV: test
          DYNAMO_POSTGRES_TEST_URL: postgres://ci_pay_user@127.0.0.1:5432/ci_pay
        run: node --test scripts/postgres-acceptance.test.js
